name: Terraform Deployment

on:
workflow_dispatch:
inputs:
action:
description: "Choose apply or destroy"
required: true
default: apply
type: choice
options:
- apply
- destroy
region:
description: "Select AWS Region"
required: true
type: choice
options:
- us-east-1
- us-east-2
- us-west-1
- us-west-2

jobs:
terraform:
runs-on: ubuntu-latest
environment: ${{ github.event.inputs.region }}

```
steps:
  - name: Checkout workflow repo
    uses: actions/checkout@v4

  - name: Checkout Terraform private repo
    uses: actions/checkout@v4
    with:
      repository: YOUR_USERNAME/YOUR_TERRAFORM_REPO
      token: ${{ secrets.GITHUB_TOKEN }}
      path: terraform-code

  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ github.event.inputs.region }}

  - name: Create terraform.tfvars
    run: |
      echo "${{ secrets.TFVARS }}" > terraform.tfvars
    working-directory: terraform-code

  - name: Terraform Init
    run: terraform init
    working-directory: terraform-code

  - name: Terraform Apply
    if: ${{ github.event.inputs.action == 'apply' }}
    run: terraform apply -auto-approve
    working-directory: terraform-code

  - name: Terraform Destroy
    if: ${{ github.event.inputs.action == 'destroy' }}
    run: terraform destroy -auto-approve
    working-directory: terraform-code
```
