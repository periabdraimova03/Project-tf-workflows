name: Terraform

on:

  workflow_dispatch:
    inputs:
      action:
        description: "Select your choice"
        required: true
        type: choice
        options:
        - apply
        - destroy

      region:
        description: "Select your region"
        required: true
        type: choice
        options:
        - us-east-1
        - us-east-2
        - us-west-1
        - us-west-2

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.region }}

    steps:
      - name: Checkout workflow repo 
        uses: actions/checkout@v4

      - name: Checkout Terraform private repo 
        uses: actions/checkout@v4 
        with: 
          repository: periabdraimova03/Project-tf-workflows 
          token: ${{ secrets.GITHUB_TOKEN }} 
          path: terraform-code  

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.region }}
    
      - name: Create tfvars file
        run: |
          echo "${{ secrets.TFVARS }}" > terraform.tfvars 
        working-directory: terraform-code

      - name: Terraform Init
        run: terraform init -backend-config=key="${{ inputs.region }}"/terraform.tfstate

      - name: Terraform Apply or Destroy
        run: |
          if [[ "${{ inputs.action }}" == "apply" ]]
          then
            terraform apply -auto-approve
          else
            terraform destroy -auto-approve
          fi 